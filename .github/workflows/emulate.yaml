# The emulate.dev test tier: the Slack adapter against a local emulator. It
# lives in its own workflow so that a failure here does not mark CI red. See
# "Emulator Tests" in CONTRIBUTING.md.
name: Emulate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulate:
    name: emulate (slack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install mise-pinned toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Start emulate
        run: |
          nohup mise run emulate > "$RUNNER_TEMP/emulate.log" 2>&1 &
          for _ in $(seq 90); do
            if curl -fsS -X POST -H 'Authorization: Bearer xoxb-emulate-bot' \
              http://127.0.0.1:4710/api/auth.test > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "emulate did not start within 90 seconds"
          cat "$RUNNER_TEMP/emulate.log"
          exit 1

      - name: Test
        run: mise run test:emulate
        env:
          GOFLAGS: -race

      - name: Show emulate log
        if: always()
        run: cat "$RUNNER_TEMP/emulate.log"
