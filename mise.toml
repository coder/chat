[tools]
go = "1.26.3"
"npm:clawpatch" = "0.3.0"
pitchfork = "2.11.0"

[tasks.test]
description = "Run tests for every Go module in the workspace"
depends = ["test:root", "test:adapters", "test:examples"]

[tasks."clawpatch:autofix"]
description = "Fix Clawpatch findings, run Codex cleanup passes, and commit"
run = "scripts/clawpatch-autofix.sh"

[tasks."clawpatch:init"]
description = "Initialize Clawpatch if needed and refresh the feature map"
run = [
  "test -f clawpatch.config.json || clawpatch init",
  "clawpatch map",
]

[tasks."test:adapters"]
description = "Run adapter-focused tests"
run = [
  "go test ./adapters/...",
  "cd state/nats && go test ./...",
  "cd state/postgres && go test ./...",
  "cd state/redis && go test ./...",
]

[tasks."test:nats"]
description = "Run NATS JetStream state tests with an embedded server"
run = "cd state/nats && go test ./..."

[tasks."test:postgres"]
description = "Run Postgres state integration tests with Testcontainers"
run = "cd state/postgres && go test ./..."

[tasks."test:redis"]
description = "Run Redis state integration tests with Testcontainers"
run = "cd state/redis && go test ./..."

[tasks."test:root"]
description = "Run tests for the root Go module"
run = "go test ./..."

[tasks.vet]
description = "Run go vet for every Go module in the workspace"
run = [
  "go vet ./...",
  "cd state/nats && go vet ./...",
  "cd state/postgres && go vet ./...",
  "cd state/redis && go vet ./...",
  "cd examples/slack-nats-state && go vet ./...",
  "cd examples/slack-redis-state && go vet ./...",
  "cd examples/slack-postgres-state && go vet ./...",
]

[tasks."test:examples"]
description = "Run example module tests"
run = [
  "cd examples/slack-nats-state && go test ./...",
  "cd examples/slack-redis-state && go test ./...",
  "cd examples/slack-postgres-state && go test ./...",
]
